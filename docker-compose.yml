version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quant-board-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fomo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fomo}
      POSTGRES_DB: ${POSTGRES_DB:-fomo_indexes}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fomo} -d ${POSTGRES_DB:-fomo_indexes}']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quant-board-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: quant-board-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NANSEN_API_KEY: ${NANSEN_API_KEY:-}
      PORT_API: ${PORT_API:-3001}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      REBALANCE_THRESHOLD: ${REBALANCE_THRESHOLD:-0.05}
      MIN_CREDITS_FOR_RISK: ${MIN_CREDITS_FOR_RISK:-20}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fomo}:${POSTGRES_PASSWORD:-fomo}@postgres:5432/${POSTGRES_DB:-fomo_indexes}
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:${PORT_API:-3001}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'bun -e "const r=await fetch(\"http://127.0.0.1:3001/api/index/current\");process.exit(r.ok?0:1)"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: quant-board-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PORT_WEB:-3000}:3000'

volumes:
  postgres-data:
  redis-data:
